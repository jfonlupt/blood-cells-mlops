[project]
name = "BDS_Blood_Cells"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "coolname>=2",
    "torch>=2.13",
    "torchvision>=0.28",
    "torchmetrics>=1.9",
    "torchstain>=1.4",
    "kornia>=0.8",
    "numpy>=2.5",
    "pandas==3.0.5",
    "scikit-learn>=1.9",
    "matplotlib>=3.11",
    "seaborn>=0.13",
    "pillow>=12",
    "tqdm>=4.70",
    "timm>=1.0.29",
    "streamlit>=1.63.0",
    "watchdog>=6",
    "opencv-python-headless>=5.0.0.93",
    "mlflow-skinny>=3",
    "boto3>=1.40",
    "bentoml>=1.4.39",
    "pyjwt>=2.15.1",
    "evidently>=0.7.23,<0.8",
    "dvc[s3]>=3.67.1",
    "botocore[crt]>=1.43.106",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.16.5",
]
server = [
    "fastapi>=0.143.1",
    "uvicorn>=0.52.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "F",          # Pyflakes
    "W",          # PyCodeStyle
    "D",          # Docstrings
    "I",          # Sort imports
    "UP",         # upgrade python version
    "C4",         # Comprehensions
    "FA",         # __future__ imports
    "ISC",        # string concat
    "ICN",        # import convention
    "RET",        # return practice
    "SIM",        # simplification
    "TID",        # import practice
    "TC",         # import in type check
    "PTH",        # pathlib
    "TD",         # TODO comments
    "NPY",        # numpy
    "FURB",       # python patterns
    "S",          # security
]
ignore = ["D417", "F401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "SLF001", "ICN001"]

[tool.ruff.lint.pydocstyle]
convention = "google"
