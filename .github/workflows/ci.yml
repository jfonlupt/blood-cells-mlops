name: CI

# Qualité du code à chaque pull request et à chaque push sur main :
#   - ruff : style, imports, docstrings, règles de sécurité (config de pyproject.toml) ;
#   - pytest : tests unitaires de tests/.
# PyTorch est installé en version CPU (≈ 200 Mo au lieu de ≈ 3 Go avec CUDA) :
# les tests n'ont pas besoin de GPU et la CI reste rapide.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Une nouvelle exécution sur la même branche annule la précédente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: ruff check
        # même version que celle utilisée en local par l'équipe
        run: uvx ruff@0.16.5 check src tests --output-format=github

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Installer les dépendances (PyTorch CPU)
        run: |
          uv venv
          uv pip install --torch-backend=cpu -r pyproject.toml --group dev

      - name: pytest
        run: .venv/bin/pytest -q --junitxml=pytest-report.xml

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          retention-days: 14
