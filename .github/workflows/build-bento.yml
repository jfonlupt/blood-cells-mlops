name: Image BentoML

# Construit l'image Docker du service de prédiction (bentofile.yaml), vérifie
# qu'elle démarre et que l'authentification répond, puis la publie dans
# Amazon ECR (eu-west-3).
#
# Authentification AWS par OIDC : aucune clé d'accès n'est stockée dans GitHub.
# Le rôle IAM n'accepte que les workflows de la branche main de ce dépôt
# (voir deploiement/aws/2_ecr_et_github_oidc.sh).
#
# Sur la VM, récupérer l'image publiée :
#   aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
#   docker pull $ECR_REGISTRY/blood-cells-service:latest
#   docker tag  $ECR_REGISTRY/blood-cells-service:latest blood_cells_service:latest
#   docker compose up -d blood_cells_server

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "bentofile.yaml"
      - "pyproject.toml"
      - ".github/workflows/build-bento.yml"
  workflow_dispatch:

concurrency:
  group: build-bento-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # nécessaire pour l'authentification OIDC auprès d'AWS

env:
  AWS_REGION: eu-west-3
  AWS_ROLE_ARN: arn:aws:iam::123456789012:role/blood-cells-github-actions
  ECR_REGISTRY: 123456789012.dkr.ecr.eu-west-3.amazonaws.com
  ECR_REPOSITORY: blood-cells-service
  BENTO_TAG: blood_cells_service:latest

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # L'image embarque PyTorch (plusieurs Go) : on libère de la place sur le runner
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      # bentoml build importe le service : il faut ses dépendances (CPU suffit ici,
      # l'image finale installe les versions figées de bentofile.yaml)
      - name: Installer les dépendances
        run: |
          BENTO_VER=$(grep -oP 'bentoml==\K[0-9.]+' bentofile.yaml)
          echo "bentoml épinglé par bentofile.yaml : ${BENTO_VER}"
          uv venv
          uv pip install --torch-backend=cpu -r pyproject.toml "bentoml==${BENTO_VER}"

      - name: bentoml build + containerize
        run: |
          .venv/bin/bentoml build
          .venv/bin/bentoml containerize "$BENTO_TAG" -t "$BENTO_TAG"

      # Test de fumée : l'image démarre, /healthz répond, /login refuse un intrus
      # et délivre un jeton aux bons identifiants (secrets jetables, propres à ce test).
      - name: Test de fumée de l'image
        run: |
          docker run -d --name bento-smoke -p 3000:3000 \
            -e JWT_SECRET_KEY=ci-only-secret -e BENTO_USER=ci -e BENTO_PASSWORD=ci \
            -e MLFLOW_TRACKING_URI=http://127.0.0.1:5001 \
            "$BENTO_TAG"
          for i in $(seq 1 60); do
            curl -sf localhost:3000/healthz && break
            sleep 2
          done
          curl -sf localhost:3000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/login \
            -H 'Content-Type: application/json' \
            -d '{"credentials":{"username":"intrus","password":"faux"}}')" = "401"
          curl -sf -X POST localhost:3000/login -H 'Content-Type: application/json' \
            -d '{"credentials":{"username":"ci","password":"ci"}}' | jq -e '.token | length > 20'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/predict \
            -F model=x -F images=@data/test_data/lymphocyte_0.jpg)" = "401"
          echo "Image OK"

      - name: Logs du conteneur (en cas d'échec)
        if: failure()
        run: docker logs bento-smoke || true

      - name: Connexion à AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connexion à ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publier l'image (tags = commit + latest)
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker tag "$BENTO_TAG" "$IMAGE:${GITHUB_SHA::7}"
          docker tag "$BENTO_TAG" "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:${GITHUB_SHA::7}\` (et \`latest\`)" >> "$GITHUB_STEP_SUMMARY"
