# Config de base — reprend les valeurs par défaut de ExperimentConfig.
# Le grid search tourne par défaut en holdout (validation croisée = coût x N).
task: criticality
seed: 0
verbose: true

data:
  datasets: [barcelona, munich]
  n_images: 0            # 0 = tout le dataset
  test_size: 0.15
  stratify: criticality

transform:
  img_size: [224, 224]
  reinhard: true
  reinhard_samples: 500
  clahe: true
  clahe_clip_limit: 2.0
  clahe_grid_size: 8
  jpeg: true
  jpeg_quality: 60
  p_rotation: 0.5
  p_brightness: 0.5
  p_contrast: 0.5
  brightness_delta: 0.25
  contrast_delta: 0.15
  p_flip: 0.5
  p_blur: 0.0
  blur_kernel_size: 5
  blur_sigma_min: 0.1
  blur_sigma_max: 2.0

model:
  name: transfer
  transfer:
    backbone: densenet121           # tout nom connu de timm
    pretrained: true
    freeze: none                  # none | all (linear probing : backbone gelé, BN en eval)
    head_hidden: []               # couches cachées du MLP ; [] = Linear direct
    head_dropout: 0.0
    backbone_lr_mult: 1.         # lr backbone = optim.lr * mult ; 0 ≈ gelé

loss:                    # Config retenue pour la tâche `criticality` — cf. reports/note_reequilibrage_classes.md
  beta: 0.0              # non pondéré : redondant une fois la matrice de coût réglée
  gamma: 0.0
  lambda_cost: 1.0
  extra_weight: {}
  label_smoothing: 0.0
  cost_matrix: [[0.0, 0.5, 1.0], [2.0, 0.0, 1.0], [4.0, 2.0, 0.0]]

optim:
  name: adam
  lr: 0.001
  weight_decay: 0.0

scheduler:
  name: plateau
  patience: 3
  lr_min: 0.0
  step_gamma: 0.1

train:
  nb_epoch: 50
  batch_size: 32
  validation: holdout
  val_size: 0.15
  cross_val_folds: 3
  early_stopping_patience: 10
  device: auto
  sampler: none        # none | weight (WeightedRandomSampler)
  sampler_alpha: 1.0   # exposant sur 1/fréquence : 0=uniforme, 1=inverse-fréquence, 0.5=racine
  num_workers: 6       # nombre de workers des DataLoader (0 = process principal)
  grad_clip_norm: 1.0  # 0 = desactive ; sinon norme max du gradient (clip_grad_norm_)

output:
  root: results
  save_checkpoint: true
  save_figures: true
