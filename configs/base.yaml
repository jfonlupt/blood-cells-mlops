# Config de base — reprend les valeurs par défaut de ExperimentConfig.
# Le grid search tourne par défaut en holdout (validation croisée = coût x N).
task: type
seed: 0
verbose: true

grid:
  max_combinations: 200

data:
  datasets: [barcelona, munich]
  n_images: 0            # 0 = tout le dataset
  test_size: 0.15
  stratify: type_dataset

transform:
  img_size: [224, 224]
  reinhard: true
  reinhard_samples: 500
  clahe: true
  clahe_clip_limit: 2.0
  clahe_grid_size: 8
  jpeg: true
  jpeg_quality: 60
  p_rotation: 0.5
  p_brightness: 0.5
  p_contrast: 0.5
  brightness_delta: 0.25
  contrast_delta: 0.15
  p_flip: 0.5
  p_blur: 0.0
  blur_kernel_size: 5
  blur_sigma_min: 0.1
  blur_sigma_max: 2.0

model:
  name: baseline

loss:                    # perte unique : CE pondérée + focal + coût espéré (cf. ClinicalLoss)
  # Config retenue pour la tâche `type` — cf. reports/note_reequilibrage_classes.md
  beta: 0.999             # class-balanced : 0 = non pondéré, 1 = inverse-fréquence
  gamma: 0.0             # terme focal : 0 = désactivé (redondant avec matrice + sampler)
  lambda_cost: 1.0       # poids du terme de coût espéré : 0 = désactivé
  extra_weight: {}       # multiplicateur manuel par classe (boost clinique)
  label_smoothing: 0.0
  cost_matrix: [[0.0, 0.5, 1.0], [2.0, 0.0, 1.0], [4.0, 3.0, 0.0]]  # liftée via la criticité (10 classes)

optim:
  name: adam
  lr: 0.001
  weight_decay: 0.0

scheduler:
  name: plateau
  patience: 3
  lr_min: 0.0
  step_gamma: 0.1

train:
  nb_epoch: 50
  batch_size: 128
  validation: holdout
  val_size: 0.15
  cross_val_folds: 3
  early_stopping_patience: 10
  device: auto
  sampler: weight        # none | weight (WeightedRandomSampler)
  sampler_alpha: 1.0   # exposant sur 1/fréquence : 0=uniforme, 1=inverse-fréquence, 0.5=racine
  num_workers: 8       # nombre de workers des DataLoader (0 = process principal)
  grad_clip_norm: 1.0  # 0 = desactive ; sinon norme max du gradient (clip_grad_norm_)

output:
  root: results
  save_checkpoint: true
  save_figures: true
